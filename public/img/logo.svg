<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="Logo ADUKANAJA">
  <defs>
    <linearGradient id="sw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6FDC"/>
      <stop offset="1" stop-color="#0B2A6B"/>
    </linearGradient>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B2A6B"/>
      <stop offset="1" stop-color="#1E56B5"/>
    </linearGradient>
  </defs>

  <!-- perisai (terbuka di sisi kanan bawah, dilewati lengkung) -->
  <path d="M72 150 L69 46 L199 8 L329 38 L327 150" fill="none" stroke="#0B2A6B" stroke-width="10" stroke-linejoin="miter" stroke-linecap="butt"/>

  <!-- tiang & bendera -->
  <rect x="196" y="40" width="3.5" height="34" fill="#0B2A6B"/>
  <path d="M199.5 41 L224 41 L224 55 L199.5 55 Z" fill="#0B2A6B"/>

  <!-- atap gedung utama -->
  <path d="M136 117 L198 72 L260 117 Z" fill="#0B2A6B"/>
  <path d="M130 120 L198 70 L266 120" fill="none" stroke="#0B2A6B" stroke-width="7" stroke-linejoin="miter"/>
  <circle cx="198" cy="102" r="6.5" fill="#fff"/>

  <!-- badan gedung -->
  <rect x="158" y="114" width="80" height="86" fill="#0B2A6B"/>
  <rect x="98" y="130" width="62" height="70" fill="#0B2A6B"/>
  <rect x="236" y="130" width="62" height="70" fill="#0B2A6B"/>

  <!-- jendela sayap kiri & kanan -->
  <g fill="#fff">
    <rect x="110" y="148" width="19" height="21"/><rect x="134" y="148" width="19" height="21"/>
    <rect x="244" y="148" width="19" height="21"/><rect x="268" y="148" width="19" height="21"/>
  </g>
  <g stroke="#0B2A6B" stroke-width="2.2">
    <path d="M119.5 148 V169 M110 158.5 H129 M143.5 148 V169 M134 158.5 H153"/>
    <path d="M253.5 148 V169 M244 158.5 H263 M277.5 148 V169 M268 158.5 H287"/>
  </g>

  <!-- jendela gedung utama -->
  <g fill="#fff">
    <rect x="173" y="130" width="16" height="22"/><rect x="207" y="130" width="16" height="22"/>
  </g>
  <g stroke="#0B2A6B" stroke-width="2.2">
    <path d="M181 130 V152 M173 141 H189 M215 130 V152 M207 141 H223"/>
  </g>

  <!-- pintu -->
  <rect x="182" y="164" width="32" height="38" fill="#2F6FDC"/>
  <path d="M198 164 V202" stroke="#0B2A6B" stroke-width="2.4"/>

  <!-- buku terbuka (separuh kiri digambar, separuh kanan dicerminkan) -->
  <defs>
    <g id="separuh-buku">
      <path d="M34 186 C102 170 172 190 205 240 L197 251 C160 210 98 194 34 186 Z" fill="url(#pg)"/>
      <path d="M2 232 C84 214 170 234 199 274 L199 290 C158 254 80 238 2 232 Z" fill="#0B2A6B"/>
    </g>
  </defs>
  <use href="#separuh-buku"/>
  <use href="#separuh-buku" transform="translate(398 0) scale(-1 1)"/>

  <!-- lengkung dinamis di kanan -->
  <path d="M334 66 C402 52 440 94 416 134 C398 166 356 186 318 198 C358 176 390 150 395 124 C400 98 372 78 334 66 Z" fill="url(#sw)"/>
  <path d="M296 104 C310 100 322 96 334 94" stroke="#9DB8EA" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
